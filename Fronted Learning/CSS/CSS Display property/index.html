<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display property</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            display: inline-block;
            width: 344px;
            padding: 45px;
            margin: 34px;
            
        }
        .box1{
            /* display: none; */
            /* visibility: hidden; */
            
        }
    </style>
</head>
<body>
    <!-- div ek block level element hai -->
    <div class="box box1">
        i am a box
    </div>
    <div class="box">also a nice box</div>
    <!-- span ek inline element hai -->
    <span> i am a good</span>
    <span>boy</span>
</body>
</html>
