<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form for personal info</title>
</head>
<body>
    <!--without using br tag, make a form that accept Name , contact no., adress,pincode-->
    <h1>contact form</h1>
    <form action="post">
        <div>
            <label for="name">Enter your full name</label>
            <input type="text" id="name" placeholder="name" autofocus>
        </div>
        <div>
            <label for="gender">select your gender </label>
            <select name="select your gender" id="gender">
                <option value="Male">male</option>
                <option value="female">female</option>
                <option value="others">others</option>
            </select>
        </div>
        <div>
            <label for="contact no.">Enter your contact no.</label>
            <input type="text" id="contact no." placeholder="contact no.">
        </div>

    </form>
</body>
</html>
