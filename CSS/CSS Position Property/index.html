<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .box {
            height: 933px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid blue;
        }


        .box1 {
            background-color: aqua;
            /* position: sticky;
            top: 0px;
            height:111px;
            width:100%;
            margin: 0;
            padding: 0; */
            position: absolute;
            top: 0px;
            left: 1px;
        }

        .box2 {
            background-color: aliceblue;
            height: 80\0px;
            /* position: relative; */
            /* top: 34px;
            left: 56px; */
            /* z-index use karne ke liye position static nhi hona chahiye uske alawa relative absloute fixed sticky */
            /* z-index: 1; */
        }

        .box3 {
            background-color: blueviolet;
            /* position: fixed; */
            /* bottom: 0px;
            left: 8vw;
            height: 111px; */
        }

        .box4 {
            background-color: chartreuse;
        }

        
        .parent {
            
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            /* Exception :-transform,filter, or perspective properties can also make an element appear as positioned */
            /* position: sticky; */
            transform: translate(0);
            filter:invert(0) ;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1">

        </div>
        <div class="box box2">

        </div>
        <div class="box box3">

        </div>
        <div class="box box4">

        </div>
    </div>
    position absloute - apne nearest parent ko dhundhta hai ko ki positioned ho, ek baar usko parent positioned mil gya fir wo apna all proprty(top, left , right etc..)usi accodring adjust karega
</body>

</html>
