<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform demo</title>
</head>
<body>
    <div class="wrap">
        <!-- scaleX: Scales the element on the X-axis. -->
        <div class="box">
           <div class="scaleX">
            scaleX
           </div>
        </div>
        <!-- sclaeY: scales the element on the Y-axis -->
        <div class="box">
            <div class="scaleY">
                scaleY
            </div>
        </div>
        <!-- scales the element on both x and y axxis -->
        <div class="box">
            <div class="scaleX-Y">
                scale X-Y
            </div>
        </div>
        <!-- translate in x direction -->
        <div class="box">
            <div class="transform-X">
                Transform-X
            </div>
        </div>
        <!-- translate in y dir -->
        <div class="box">
            
        </div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
